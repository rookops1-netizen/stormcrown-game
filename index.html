<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Stormcrown Chronicles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    
    #health-bar {
      background: rgba(0,0,0,0.6); border-radius: 12px;
      padding: 8px 16px; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    #health-label { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    
    #health-track {
      width: 200px; height: 8px; background: rgba(255,255,255,0.1);
      border-radius: 4px; overflow: hidden;
    }
    
    #health-fill {
      width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #44ff44);
      border-radius: 4px; transition: width 0.3s;
    }
    
    #hero-switch {
      display: flex; gap: 8px; pointer-events: auto;
    }
    
    .hero-btn {
      width: 64px; height: 64px; border-radius: 12px;
      border: 3px solid rgba(255,255,255,0.2); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      transition: all 0.2s; backdrop-filter: blur(8px);
    }
    
    .hero-btn.active { border-color: #FFD700; transform: scale(1.1); box-shadow: 0 0 20px rgba(255,215,0,0.4); }
    .hero-btn:hover { transform: scale(1.05); }
    
    #hero-zeal { background: rgba(76,175,80,0.6); color: #a5d6a7; }
    #hero-brave { background: rgba(244,67,54,0.6); color: #ef9a9a; }
    #hero-river { background: rgba(33,150,243,0.6); color: #90caf9; }
    
    .hero-btn .hero-key {
      font-size: 8px; opacity: 0.6; margin-top: 2px;
    }
    
    #controls-hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); border-radius: 12px;
      padding: 8px 20px; backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.7); font-size: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none; z-index: 10;
    }
    
    #title-screen {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(180deg, #1a0a00 0%, #2d1810 50%, #1a0a00 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s;
    }
    
    #title-screen h1 {
      font-size: 56px; color: #FFD700; text-shadow: 0 0 40px rgba(255,215,0,0.3);
      letter-spacing: 4px; margin-bottom: 8px;
    }
    
    #title-screen .subtitle {
      color: rgba(255,255,255,0.5); font-size: 18px; margin-bottom: 60px;
      font-style: italic;
    }
    
    #start-btn {
      background: linear-gradient(135deg, #FFD700, #FF8C00); color: #1a0a00;
      border: none; padding: 16px 48px; font-size: 20px; font-weight: 700;
      border-radius: 12px; cursor: pointer; letter-spacing: 2px;
      text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s;
    }
    
    #start-btn:hover {
      transform: scale(1.05); box-shadow: 0 0 30px rgba(255,215,0,0.4);
    }
    
    .ember {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: #FF6600; opacity: 0; animation: float 3s infinite;
    }
    
    @keyframes float {
      0% { opacity: 0; transform: translateY(0) scale(0); }
      20% { opacity: 1; transform: translateY(-20px) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
    }
    
    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 4px; height: 4px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      pointer-events: none; z-index: 10; display: none;
    }
    
    #damage-flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 50;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.3) 100%);
      opacity: 0; transition: opacity 0.1s;
    }
    
    #message {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #FFD700; font-size: 32px; font-weight: 700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      pointer-events: none; z-index: 20; opacity: 0;
      transition: opacity 0.5s;
    }
  </style>
  <script type="module" crossorigin src="/stormcrown-game/assets/index-BqAUI3-N.js"></script>
</head>
<body>
  <div id="title-screen">
    <h1>THE STORMCROWN CHRONICLES</h1>
    <div class="subtitle">A story of three unlikely heroes</div>
    <button id="start-btn">Begin Adventure</button>
  </div>
  
  <div id="hud" style="display:none;">
    <div id="health-bar">
      <div id="health-label">ZEAL</div>
      <div id="health-track"><div id="health-fill"></div></div>
    </div>
    <div id="hero-switch">
      <button class="hero-btn active" id="hero-zeal" onclick="switchHero(0)">⚔️<br>Zeal<div class="hero-key">1</div></button>
      <button class="hero-btn" id="hero-brave" onclick="switchHero(1)">🛡️<br>Brave<div class="hero-key">2</div></button>
      <button class="hero-btn" id="hero-river" onclick="switchHero(2)">🌿<br>River<div class="hero-key">3</div></button>
    </div>
  </div>
  
  <div id="controls-hint" style="display:none;">WASD Move · SPACE Jump · CLICK Attack · 1/2/3 Switch Hero · Mouse Look</div>
  <div id="crosshair"></div>
  <div id="damage-flash"></div>
  <div id="message"></div>
  
</body>
</html>
